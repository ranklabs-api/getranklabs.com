name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, draft, 'content/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Sitemap lastmod for non-blog pages comes from the last git commit
          # that touched each page's source (astro.config.mjs, lastmodFor).
          # checkout defaults to a depth-1 shallow clone, where every file's
          # last commit is the deploy commit — every static page would then
          # claim it changed on deploy day. Full history keeps the dates real.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Block indexing on non-production branches
        if: github.ref_name != 'main'
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' >> dist/_headers
      - run: npx --yes wrangler pages deploy dist --project-name=ranklabs --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
